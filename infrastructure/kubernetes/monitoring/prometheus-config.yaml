apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: opspilot-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics:8080"]

      - job_name: blackbox-exporter
        static_configs:
          - targets: ["blackbox-exporter:9115"]

      - job_name: taskflow-health
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - http://taskflow-backend.opspilot.svc.cluster.local:5000/api/v1/health
              - http://taskflow-backend.opspilot.svc.cluster.local:5000/api/v1/health/db
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115
