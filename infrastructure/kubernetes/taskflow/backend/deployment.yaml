apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-backend
  namespace: opspilot
  labels:
    app.kubernetes.io/name: taskflow-backend
    app.kubernetes.io/part-of: opspilot
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: taskflow-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow-backend
        app.kubernetes.io/part-of: opspilot
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: opspilot-taskflow:19
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: taskflow-config
            - secretRef:
                name: taskflow-credentials
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health/db
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
